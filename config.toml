[server]
headless = true
maxUploadSize = 100          # MB per file. Free hosting has ~1 GB RAM -- keep demo files small.
enableXsrfProtection = true
enableCORS = false

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#2563eb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f6fa"
textColor = "#111827"
font = "sans serif"

[runner]
fastReruns = true
